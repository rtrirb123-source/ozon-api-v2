<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户管理</title>
  <style>
    html.auth-checking body{visibility:hidden}*{box-sizing:border-box}
    body{margin:0;background:#f2f5f9;color:#102342;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:980px;margin:0 auto;padding:88px 24px 50px}.top{display:flex;align-items:center;justify-content:space-between}
    h1{margin:0;font-size:30px}a{color:#087e78;text-decoration:none}.hint{color:#718096;margin:10px 0 28px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:#fff;border:1px solid #d8e1ec;border-radius:16px;padding:24px}
    h2{margin:0 0 18px}.field{display:grid;gap:7px;margin-top:15px;color:#607089;font-weight:650}.field input{height:44px;border:1px solid #cbd7e5;border-radius:9px;padding:0 12px;font:inherit}
    .save{height:44px;margin-top:20px;padding:0 20px;border:0;border-radius:9px;background:#102342;color:#fff;font:inherit;font-weight:750;cursor:pointer}.status{min-height:20px;margin-top:12px;color:#168f8a}
    .account-controls{position:fixed;z-index:50;top:16px;right:24px;display:flex;gap:13px;align-items:center;background:#fff;border:1px solid #d8e1ec;border-radius:12px;padding:9px 12px;box-shadow:0 6px 20px rgba(16,35,66,.08)}
    .account-controls button{border:0;background:transparent;color:#a52f3c;cursor:pointer}.account-controls a{display:none}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
  </style>
  <script src="/auth-guard.js?v=20260724-2"></script>
</head>
<body>
  <main>
    <div class="top"><h1>用户管理</h1><a href="/index.html">返回俄罗斯看板</a></div>
    <p class="hint">设置梦婷和云湖的登录账号与密码。密码留空表示不修改原密码。</p>
    <div class="grid" id="user-grid"></div>
  </main>
  <script src="/user-management.js?v=20260724-1"></script>
</body>
</html>
