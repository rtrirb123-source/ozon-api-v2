<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WB 本土销量看板</title>
  <link rel="stylesheet" href="./styles.css?v=20260724-wb-subnav-business-2" />
  <link rel="stylesheet" href="/auth-shared.css?v=20260724-2">
  <script src="/auth-guard.js?v=20260724-2"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>WB 本土销量看板</h1>
        <p id="syncText">正在加载 WB 数据...</p>
        <p id="syncStatusText" class="sync-status-text">同步状态读取中...</p>
      </div>
      <div class="actions">
        <input id="searchInput" type="search" placeholder="搜索 nm_id / 商品 / 类目" />
        <input id="metricDateInput" type="date" title="选择销售日期" />
        <select id="salesSort">
          <option value="desc">当日销量 高到低</option>
          <option value="asc">当日销量 低到高</option>
          <option value="none">默认排序</option>
        </select>
        <button id="refreshBtn" type="button">刷新</button>
        <button id="syncWbBtn" type="button" class="secondary">同步WB</button>
        <button id="mappingBtn" type="button" class="secondary">&#26144;&#23556;&#34920;</button>
      </div>
    </header>

    <div class="market-tabs">
      <button class="market-tab" id="ozonTab" type="button">Ozon 本土看板</button>
      <button class="market-tab active" type="button">WB 本土看板</button>
      <button class="market-tab" id="wbCrossTab" type="button">WB 跨境店</button>
    </div>

    <div class="portal-subnav wb-subnav" role="tablist" aria-label="WB 本土看板子项">
      <button class="active" type="button" data-wb-view="products">商品看板</button>
      <button type="button" data-wb-view="business">经营看板</button>
    </div>

    <section class="trend-panel wb-subview" data-wb-subview="products">
      <div class="trend-head">
        <div>
          <h2>销量动态</h2>
          <p id="trendTitle">选择一个 WB 商品查看近 30 天销量动态</p>
        </div>
        <div class="trend-legend">
          <span><i class="sales-dot"></i>销量</span>
        </div>
      </div>
      <div class="trend-grid">
        <div id="trendChart" class="trend-chart">
          <div class="trend-empty">暂无动态数据</div>
        </div>
        <div id="storeRevenueChart" class="trend-chart revenue-trend-chart">
          <div class="trend-empty">暂无销售额数据</div>
        </div>
      </div>
    </section>

    <section class="column-panel wb-subview" data-wb-subview="products">
      <div class="column-title">列表显示</div>
      <div class="column-controls">
        <label><input type="checkbox" checked disabled> 图片</label>
        <label><input type="checkbox" checked disabled> WB库存</label>
        <label><input type="checkbox" checked disabled> 昨日销量</label>
        <label><input type="checkbox" checked disabled> 佣金率</label>
        <label><input type="checkbox" checked disabled> 采购成本</label>
        <label><input type="checkbox" checked disabled> 发货成本</label>
        <label><input type="checkbox" checked disabled> 重量</label>
        <label><input type="checkbox" checked disabled> 运费系数</label>
        <label><input type="checkbox" checked disabled> 退货率</label>
        <label><input type="checkbox" checked disabled> 售价</label>
        <label><input type="checkbox" checked disabled> 广告比例</label>
        <label><input type="checkbox" checked disabled> 预期利润</label>
        <label><input type="checkbox" checked disabled> 竞品对比</label>
        <label><input type="checkbox" checked disabled> 产品策略</label>
      </div>
    </section>

    <section class="stats wb-subview" id="stats" data-wb-subview="products"></section>

    <main class="table-shell wb-subview" data-wb-subview="products">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="productBody"></tbody>
      </table>
    </main>

    <section class="trend-panel wb-business-panel wb-subview" id="wbBusinessPanel" data-wb-subview="business" hidden>
      <div class="trend-head">
        <div>
          <h2>WB 经营看板</h2>
          <p id="wbBusinessTitle">按当前日期和近 30 天趋势汇总 WB 本土店经营表现</p>
        </div>
        <div class="trend-legend">
          <span><i class="sales-dot"></i>销量</span>
          <span><i class="ad-dot"></i>销售额</span>
        </div>
      </div>
      <div id="wbBusinessStats" class="business-stats"></div>
      <div class="business-grid">
        <div id="wbBusinessRevenueChart" class="trend-chart">
          <div class="trend-empty">暂无销售额数据</div>
        </div>
        <div id="wbBusinessTopProducts" class="trend-chart">
          <div class="trend-empty">暂无商品排行数据</div>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>


  <dialog id="mappingDialog">
    <form method="dialog" class="mapping-dialog">
      <div class="mapping-head">
        <h2>WB &#26144;&#23556;&#34920;</h2>
        <button value="cancel" type="button" id="closeMappingBtn" class="secondary">&#20851;&#38381;</button>
      </div>
      <div class="mapping-tools">
        <input id="mappingSearchInput" type="search" placeholder="&#25628;&#32034;&#26412;&#22303;/&#36328;&#22659; nm_id&#12289;SKU&#12289;&#21830;&#21697;" />
        <button id="refreshMappingBtn" type="button" class="secondary">&#21047;&#26032;</button>
      </div>
      <div class="mapping-add">
        <input id="newLocalNmId" placeholder="WB &#26412;&#22303; nm_id" />
        <input id="newCrossNmId" placeholder="WB &#36328;&#22659; nm_id" />
        <button id="addMappingBtn" type="button">&#28155;&#21152;&#26144;&#23556;</button>
      </div>
      <div class="mapping-table-wrap">
        <table class="mapping-table">
          <thead>
            <tr>
              <th>WB &#26412;&#22303;</th>
              <th>WB &#36328;&#22659;</th>
              <th>&#26356;&#26032;&#26102;&#38388;</th>
              <th>&#25805;&#20316;</th>
            </tr>
          </thead>
          <tbody id="mappingBody"></tbody>
        </table>
      </div>
    </form>
  </dialog>

  <script src="./wb.js?v=20260724-wb-subnav-business-2"></script>
</body>
</html>
